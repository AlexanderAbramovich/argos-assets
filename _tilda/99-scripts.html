<!-- T123 в САМОМ КОНЦЕ страницы (или Настройки сайта → код перед </body>): все скрипты -->
<!-- @BLOCKS_JS:start -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4/dist/model-viewer.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var hasGsap = typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined';
  /* сцены инициализируются под режим (телефон/десктоп, тач/мышь) один раз; пересечение брейкпоинта без перезагрузки
     (DevTools-эмуляция ↔ окно, планшет с поворотом) оставляло кашу из двух режимов — просто перезагружаем страницу */
  [matchMedia('(min-width: 960px)'), matchMedia('(hover: hover)')].forEach(function(mq){
    var was = mq.matches, t;
    mq.addEventListener('change', function(){ clearTimeout(t); t = setTimeout(function(){ if (mq.matches !== was) location.reload(); }, 400); });
  });
  if (hasGsap) gsap.registerPlugin(ScrollTrigger);

  /* ---------- появление на скролле ---------- */
  var rv = Array.prototype.slice.call(document.querySelectorAll('.rv'));
  if (reduce || !('IntersectionObserver' in window)) {
    rv.forEach(function(el){ el.classList.add('is-in'); });
  } else {
    var rio = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add('is-in'); rio.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    rv.forEach(function(el){ rio.observe(el); });
  }

  /* ---------- скраб-сцены: кадры крутятся скроллом ---------- */
  function pad(n, w){ n = String(n); while (n.length < w) n = '0' + n; return n; }

  function initScrub(scene){
    var media  = scene.querySelector('.media');
    var canvas = scene.querySelector('canvas');
    var img    = media.querySelector('img');
    var tpl    = scene.getAttribute('data-frames');
    if (tpl && !window.matchMedia('(min-width: 960px)').matches && (window.devicePixelRatio || 1) < 1.5) tpl = tpl.replace('/f_{i}', '/m_{i}');   /* мелкие кадры только на 1x-экранах */
    var count  = parseInt(scene.getAttribute('data-count'), 10) || 0;
    var padW   = parseInt(scene.getAttribute('data-pad'), 10) || 3;
    var fit    = (media.classList.contains('stage-media') || media.classList.contains('op-media')) && desktopFit() ? 'contain' : 'cover';
    function desktopFit(){ return window.matchMedia('(min-width: 960px)').matches; }
    function fitMode(){ return media.getAttribute('data-fit') || fit; }
    var callouts = Array.prototype.slice.call(scene.querySelectorAll('.callout'));
    var revealAt = parseFloat(scene.getAttribute('data-reveal')) || 0;
    var desktop = window.matchMedia('(min-width: 960px)').matches;
    var frames = [], loaded = 0, cur = -1, ctx = canvas.getContext('2d');

    function src(i){ return tpl.replace('{i}', pad(i, padW)); }

    /* плашки на рейках: якорь и высота плашки заданы в % кадра → переводим в px той же математикой, что и draw() */
    function layoutCallouts(){
      var f = frames[0]; if (!desktop || !f || !f.naturalWidth) return;
      var W = media.clientWidth, H = media.clientHeight;
      var mode = fitMode();
      var iw = f.naturalWidth, ih = f.naturalHeight, s = mode === 'contain' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
      var dw = iw * s, dh = ih * s, dx = (W - dw) / 2, dy = mode === 'cover-bottom' ? (H - dh) : (H - dh) / 2;
      var inset = Math.max(48, W * 0.035), rails = { l: [], r: [] };
      callouts.forEach(function(c){
        if (!c.hasAttribute('data-fx')) return;
        var txt = c.querySelector('.txt'); if (!txt) return;
        var ax = dx + parseFloat(c.getAttribute('data-fx')) / 100 * dw;
        var ay = dy + parseFloat(c.getAttribute('data-fy')) / 100 * dh;
        var by = dy + parseFloat(c.getAttribute('data-by')) / 100 * dh;
        var bw = txt.offsetWidth || 240, bh = txt.offsetHeight || 100;
        by = Math.max(bh / 2 + 16, Math.min(H - bh / 2 - 16, by));
        var side = c.getAttribute('data-side') || 'r';
        var ex = side === 'r' ? (W - inset - bw) : (inset + bw);
        rails[side].push({ c: c, ax: ax, ay: ay, by: by, bh: bh, ex: ex });
      });
      /* на одной рейке плашки не должны наезжать: сверху вниз раздвигаем с зазором 12px */
      Object.keys(rails).forEach(function(side){
        var list = rails[side].sort(function(p, q){ return p.by - q.by; }), prevBottom = -1e9;
        list.forEach(function(it){ var top = Math.max(it.by - it.bh / 2, prevBottom + 12); it.by = Math.min(H - it.bh / 2 - 16, top + it.bh / 2); prevBottom = it.by + it.bh / 2; });
        list.forEach(function(it){
          var tx = it.ex - it.ax, ty = it.by - it.ay, c = it.c;
          c.style.setProperty('--x', it.ax.toFixed(1) + 'px'); c.style.setProperty('--y', it.ay.toFixed(1) + 'px');
          c.style.setProperty('--tx', tx.toFixed(1) + 'px'); c.style.setProperty('--ty', ty.toFixed(1) + 'px');
          c.style.setProperty('--len', Math.hypot(tx, ty).toFixed(1) + 'px');
          c.style.setProperty('--ang', (Math.atan2(ty, tx) * 180 / Math.PI).toFixed(2) + 'deg');
        });
      });
    }

    function draw(i){
      var f = frames[i]; if (!f || !f.complete || !f.naturalWidth) return;
      var W = media.clientWidth, H = media.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      var mode = fitMode();
      var iw = f.naturalWidth, ih = f.naturalHeight, s = mode === 'contain' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
      var dw = iw * s, dh = ih * s, dx = (W - dw) / 2, dy = mode === 'cover-bottom' ? (H - dh) : (H - dh) / 2;
      if (!desktop && media.classList.contains('op-media')) {   /* телефон: cover в компактный бокс, голова (≈57 % ширины кадра) по центру, верх кадра — верх бокса */
        s = Math.max(W / iw, H / ih); dw = iw * s; dh = ih * s;
        dx = Math.min(0, Math.max(W - dw, W / 2 - 0.57 * dw)); dy = 0;
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.drawImage(f, dx, dy, dw, dh);
      cur = i;
    }

    function setProgress(p){
      p = Math.max(0, Math.min(1, p));
      var i = Math.min(count - 1, Math.round(p * (count - 1)));
      if (frames.length && i !== cur) draw(i);
      if (revealAt) media.style.setProperty('--reveal', (desktop ? Math.min(1, 0.35 + p / revealAt * 0.65) : Math.min(1, p / revealAt)).toFixed(3));
      callouts.forEach(function(c){
        var at = parseFloat(c.getAttribute('data-at'));
        c.classList.toggle('is-on', p >= at - 0.02);
      });
    }

    function bind(){
      if (!hasGsap || reduce) { setProgress(1); return; }
      if (!desktop) {   /* телефон: не скраб — один проигрыш при появлении: из темноты → поворот головы → требования по очереди */
        var played = false, o = { p: 0 };
        setProgress(0);
        var io = new IntersectionObserver(function(en){
          if (!en[0].isIntersecting || played) return; played = true; io.disconnect();
          gsap.to(o, { p: 1, duration: 3, ease: 'power2.inOut', onUpdate: function(){ setProgress(o.p); } });
        }, { threshold: 0.3 });
        io.observe(media);
        return;
      }
      var st = ScrollTrigger.create({
        trigger: scene,
        start: 'top top',
        end:   'bottom bottom',
        scrub: true,
        onUpdate: function(self){ setProgress(self.progress); }
      });
      setProgress(st.progress);   /* сразу: до первого onUpdate сцена стояла бы без маски (оператор виден до старта) */
      if (revealAt) {   /* въезд сцены в экран: оператор уже начинает проступать (0 → 35 % проявления), чтобы не было экрана черноты */
        var pre = ScrollTrigger.create({ trigger: scene, start: 'top bottom', end: 'top top', scrub: true,
          onUpdate: function(self){ if (st.progress <= 0) media.style.setProperty('--reveal', (self.progress * 0.35).toFixed(3)); } });
      }
    }

    /* пробуем первый кадр; нет — остаёмся на картинке */
    var probe = new Image();
    probe.onload = function(){
      media.classList.add('has-frames'); scene.classList.add('has-frames');
      frames[0] = probe; loaded = 1; draw(0); layoutCallouts();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutCallouts);
      for (var i = 1; i < count; i++) (function(i){
        var im = new Image(); im.decoding = 'async';
        im.onload = function(){ loaded++; if (i === cur) draw(i); };
        im.src = src(i); frames[i] = im;
      })(i);
      window.addEventListener('resize', function(){ if (cur >= 0) draw(cur); layoutCallouts(); });
      if (hasGsap) ScrollTrigger.refresh();
      bind();
    };
    /* запасной режим для Tilda (файлы ≤ 5 МБ): видео all-intra, перемотка по прогрессу */
    function initVideo(){
      var vsrc = scene.getAttribute('data-video'); if (!vsrc) { bind(); return; }
      var v = document.createElement('video');
      v.muted = true; v.playsInline = true; v.preload = 'auto'; v.setAttribute('aria-hidden', 'true');
      v.className = 'scrub-video';
      var ready = false, pending = null, seeking = false;
      v.addEventListener('loadedmetadata', function(){
        ready = true; media.classList.add('has-video'); scene.classList.add('has-frames');
        if (hasGsap) ScrollTrigger.refresh();
        bind();
      });
      v.addEventListener('seeked', function(){ seeking = false; if (pending !== null) { var t = pending; pending = null; seekTo(t); } });
      v.addEventListener('error', function(){ bind(); });
      function seekTo(t){ if (seeking) { pending = t; return; } seeking = true; try { v.currentTime = t; } catch(e){ seeking = false; } }
      setProgressVideo = function(p){ if (!ready || !isFinite(v.duration)) return; seekTo(Math.min(v.duration - 0.05, p * v.duration)); };
      v.src = vsrc; v.load();
      media.appendChild(v);
    }
    var setProgressVideo = null;
    var _setProgress = setProgress;
    setProgress = function(p){ _setProgress(p); if (setProgressVideo) setProgressVideo(Math.max(0, Math.min(1, p))); };

    probe.onerror = function(){ initVideo(); };
    if (tpl && count) probe.src = src(0); else initVideo();
  }
  Array.prototype.slice.call(document.querySelectorAll('[data-scrub]')).forEach(initScrub);

  /* ---------- 3D-сцена дрона: сборка по скроллу, потом поворот ---------- */
  Array.prototype.slice.call(document.querySelectorAll('[data-mv]')).forEach(function(stage){
    var wrap = stage.querySelector('.mv-wrap'), mv = stage.querySelector('model-viewer');
    if (!mv) return;
    var desktop = window.matchMedia('(min-width: 960px)').matches;
    var hs = Array.prototype.slice.call(mv.querySelectorAll('.hs'));
    var ready = false, failed = false;
    function fallback(){ if (failed) return; failed = true; wrap.classList.add('is-fallback'); stage.classList.remove('has-mv'); if (hasGsap) ScrollTrigger.refresh(); }
    if (!window.customElements) { fallback(); return; }
    var defTimer = setTimeout(function(){ if (!window.customElements.get('model-viewer')) fallback(); }, 12000);
    mv.addEventListener('error', fallback);
    mv.addEventListener('load', function(){
      clearTimeout(defTimer); ready = true;
      stage.classList.add('has-mv');
      try { mv.pause(); mv.currentTime = 0; } catch(e){}
      if (!desktop) {   /* телефон: сборка проигрывается сама, когда бокс в кадре, камера наезжает, дальше медленный автоповорот + палец */
        try { mv.maxCameraOrbit = 'auto 105deg 130%'; mv.cameraOrbit = '35deg 68deg 100%'; mv.cameraTarget = '0m 0.14m 0m'; } catch(e){}
        var fired = false;
        var io = new IntersectionObserver(function(en){
          if (!en[0].isIntersecting || fired) return; fired = true; io.disconnect();
          try { mv.play({ repetitions: 1 }); } catch(e){}
          if (hasGsap && !reduce) gsap.to({ a: 0 }, { a: 1, duration: 2.2, ease: 'power2.inOut', onUpdate: function(){ var a = this.targets()[0].a; mv.cameraOrbit = '35deg 68deg ' + (100 - a * 38).toFixed(1) + '%'; mv.cameraTarget = '0m ' + (0.14 - a * 0.2).toFixed(3) + 'm 0m'; },
            onComplete: function(){ try { mv.autoRotateDelay = 0; mv.rotationPerSecond = '16deg'; mv.autoRotate = true; } catch(e){} } });
          else { try { mv.cameraOrbit = '35deg 68deg 62%'; mv.cameraTarget = '0m -0.06m 0m'; mv.autoRotateDelay = 0; mv.autoRotate = true; } catch(e){} }
        }, { threshold: 0.35 });
        io.observe(wrap);
        return;
      }
      if (hasGsap) ScrollTrigger.refresh();
      if (desktop) bind();
    });
    var ASSEMBLE_END = 0.5, THETA0 = 35;
    function apply(p){
      if (!ready) return;
      var d = mv.duration || 2;
      var a = Math.min(1, p / ASSEMBLE_END);
      var t = a * (d - 0.001);
      if (Math.abs((mv.currentTime || 0) - t) > 0.004) mv.currentTime = t;
      var r = Math.max(0, (p - ASSEMBLE_END) / (1 - ASSEMBLE_END));
      var theta = THETA0 + r * 360;
      var rad = desktop ? 76 - a * 26 : 96 - a * 36;   /* наезд камеры по мере сборки (телефон: дальше, бокс портретный) */
      mv.cameraOrbit = theta.toFixed(1) + 'deg 68deg ' + rad.toFixed(1) + '%';
      mv.cameraTarget = '0m ' + (0.14 - a * 0.2).toFixed(3) + 'm 0m';   /* центр: разведённый рой выше, собранный дрон ниже */
      hs.forEach(function(h){ var at = parseFloat(h.getAttribute('data-at')); h.classList.toggle('is-on', p >= at - 0.02); });
      if (!tidyRaf) tidyRaf = requestAnimationFrame(tidy);   /* плашки мерим после того, как model-viewer спроецирует хотспоты */
    }
    var tidyRaf = 0;
    function tidy(){
      tidyRaf = 0;
      var on = hs.filter(function(h){ return h.classList.contains('is-on'); }), vw = document.documentElement.clientWidth;
      on.forEach(function(h){ h.style.setProperty('--shift', '0px'); h.classList.remove('is-flip'); });
      /* к краю экрана — переворачиваем плашку к центру */
      on.forEach(function(h){ var r = h.querySelector('.txt').getBoundingClientRect(); if (r.right > vw - 8 || r.left < 8) h.classList.add('is-flip'); });
      /* наехали друг на друга — нижнюю сдвигаем вниз, обе остаются */
      var rects = on.map(function(h){ return h.querySelector('.txt').getBoundingClientRect(); });
      for (var i = 0; i < on.length; i++) for (var k = i + 1; k < on.length; k++) {
        var a = rects[i], b = rects[k];
        if (a.left < b.right - 6 && b.left < a.right - 6 && a.top < b.bottom - 6 && b.top < a.bottom - 6) {
          var lower = a.top <= b.top ? k : i, upper = lower === k ? i : k, d = rects[upper].bottom - rects[lower].top + 8;
          var cur = parseFloat(on[lower].style.getPropertyValue('--shift')) || 0; on[lower].style.setProperty('--shift', (cur + d) + 'px');
          rects[lower] = { left: rects[lower].left, right: rects[lower].right, top: rects[lower].top + d, bottom: rects[lower].bottom + d };
        }
      }
    }
    function bind(){
      if (!hasGsap || reduce) { apply(1); return; }
      ScrollTrigger.create({ trigger: stage, start: 'top top', end: 'bottom bottom', scrub: true, onUpdate: function(self){ apply(self.progress); } });
      apply(0);
    }
  });

  /* ---------- видеополоса: грузим и играем только в зоне видимости ---------- */
  var vids = Array.prototype.slice.call(document.querySelectorAll('.reel-strip video'));
  if (reduce) { vids.forEach(function(v){ v.removeAttribute('autoplay'); }); }
  else if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        var v = e.target;
        if (e.isIntersecting) {
          if (!v.getAttribute('src')) { v.src = v.getAttribute('data-src'); v.load(); }
          var p = v.play(); if (p && p.catch) p.catch(function(){});
        } else { v.pause(); }
      });
    }, { rootMargin: '120px 0px' });
    vids.forEach(function(v){ io.observe(v); });
  }

  /* @FX:pay-odometer start */
  /* ---------- 03 Доход: счётчик купюр — значение разгоняется и тормозит, ленты цифр крутятся непрерывно ---------- */
  (function(){
    var big = document.querySelector('#pay .pay-big[data-odo]'), sec = document.getElementById('pay');
    if (!big || !sec || !hasGsap || reduce) return;                 /* без GSAP или при reduce: текст стоит как есть */
    var pw = sec.querySelector('.pay-plaque-w'), text = big.textContent, strips = [], digits = '';
    if (!/^[^<>&]+$/.test(text)) return;
    try {
      var html = '';
      for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i), d = /\d/.test(ch) ? +ch : -1;
        if (d < 0) { html += '<span class="odo-d"><span class="odo-s"><i>' + (ch === ' ' ? '\u00A0' : ch) + '</i></span></span>'; continue; }
        var s = ''; for (var k = 0; k < 20; k++) s += '<i>' + (k % 10) + '</i>';   /* лента 0–9 дважды: дробный сдвиг 9.x показывает 9 → 0 */
        html += '<span class="odo-d is-num"><span class="odo-s" data-d="' + d + '" style="--n:' + (10 + d) + '">' + s + '</span></span>';
        digits += ch;
      }
      big.innerHTML = '<span class="vh">' + text + '</span><span class="odo" aria-hidden="true">' + html + '</span>';
      strips = Array.prototype.slice.call(big.querySelectorAll('.odo-s[data-d]'));
    } catch (e) { big.textContent = text; return; }
    var n = strips.length, TARGET = parseInt(digits, 10);
    if (!n || !isFinite(TARGET)) return;
    sec.classList.add('odo-armed');
    var state = { v: 0 };
    function render(){                                               /* разряд k считает от правого края: сдвиг = (v / 10^k) mod 10, дробный */
      for (var i = 0; i < n; i++) {
        var k = n - 1 - i, frac = (state.v / Math.pow(10, k)) % 10;
        strips[i].style.transform = 'translateY(' + (-frac * .9).toFixed(4) + 'em)';
      }
    }
    render();
    var tl = gsap.timeline({ paused: true, onComplete: function(){ strips.forEach(function(el){ el.style.transform = ''; }); } });   /* финал отдаём CSS (--n): ресайз не плывёт */
    tl.to(state, { v: TARGET, duration: 2.4, ease: 'power3.out', onUpdate: render });   /* разгон и торможение: старшие докатываются первыми */
    /* посадка: табло просело на 4px и один кадр яркости; плашка вытирается тем же bWipe, что в хиро */
    tl.call(function(){ big.classList.add('is-hit'); if (pw) pw.classList.add('is-wipe'); }, null, 2.4)   /* просадку даёт CSS на обёртке .odo — ленты GSAP не трогает */
      .call(function(){ big.classList.remove('is-hit'); }, null, 2.47);
    ScrollTrigger.create({ trigger: sec.querySelector('.pay-head') || sec, start: 'top 75%', once: true, onEnter: function(){ tl.play(); } });
  })();
  /* @FX:pay-odometer end */

  /* @FX:spec-selector start */
  /* ---------- 04 Специальности: выбор класса ---------- */
  /* вход сетки: жёсткий проход 01→02→03→04→01 (.35 с шаг, каты без движения — скобки живут в карточках), дальше за мышью: наведение = выбор + pop,
     ушёл с сетки — карточка садится, выбор остаётся. Тач: выбор едет за скроллом (карточка у 45 % экрана), тап фиксирует. Без GSAP / reduce: сразу 01. */
  (function(){
    var grid = document.querySelector('#spec .spec-grid'); if (!grid) return;
    var cards = Array.prototype.slice.call(grid.querySelectorAll('.spec')); if (cards.length < 2) return;
    var cur = null, started = false, demo = [], raf = 0;
    var follow = !(window.matchMedia && matchMedia('(hover:hover)').matches);   /* тач: выбор едет за скроллом */
    function select(card, pop){
      if (cur !== card) { if (cur) cur.classList.remove('is-sel', 'is-pop'); card.classList.add('is-sel'); cur = card; }
      if (pop) {   /* масштаб pop — сколько влезает в экран по горизонтали (с полем 16px), но не больше --spec-pop */
        var r = card.getBoundingClientRect(), vw = document.documentElement.clientWidth, cx = r.left + r.width / 2;
        var max = parseFloat(getComputedStyle(grid).getPropertyValue('--spec-pop')) || 1, fitS = (2 * Math.min(cx, vw - cx) - 32) / r.width;
        card.style.setProperty('--spec-pop', Math.max(1, Math.min(max, fitS)).toFixed(3));
      }
      card.classList.toggle('is-pop', !!pop);
      var fab = document.querySelector('.fab'); if (fab) { fab.classList.add('is-quick'); fab.classList.toggle('is-off', !!pop); }   /* пока карта выехала — плавающая MAX не лежит на её тексте */
      grid.classList.add('has-sel'); started = true;
    }
    function killDemo(){ demo.forEach(function(d){ d.kill(); }); demo = []; }
    function pick(card, pop){ killDemo(); select(card, pop); }
    function nearest(){   /* карточка, чей центр ближе к 45% высоты экрана; в ряду (2 колонки) — ближняя к центру экрана по x */
      var line = innerHeight * .45, cxv = innerWidth / 2, best = cards[0], bd = 1e9;
      cards.forEach(function(c){ var r = c.getBoundingClientRect(), d = Math.abs((r.top + r.bottom) / 2 - line) + Math.abs((r.left + r.right) / 2 - cxv) * 0.001; if (d < bd) { bd = d; best = c; } });
      return best;
    }
    function runDemo(){   /* проход по карточкам в кадре и назад на первую; уже тронули мышью — не мешаем */
      if (started) return;
      var vh = innerHeight, seq = cards.filter(function(c){ var r = c.getBoundingClientRect(); return r.top < vh * .8 && r.bottom > vh * .2; });
      if (!seq.length) seq = [cards[0]];

  loop.load();

  if (small) {
    /* телефон: без заставки, сразу петля и HUD */
    if (intro) { intro.remove(); intro = null; }
    startLoop(); boot();
    return;
  }

  /* десктоп: заставка один раз → удар герба включает HUD → петля */
  intro.src = intro.getAttribute('data-src');
  intro.load();
  intro.addEventListener('playing', function(){
    intro.classList.add('is-on');
    body.classList.add('has-intro');
    requestAnimationFrame(tcTick);
  }, { once:true });
  intro.addEventListener('timeupdate', function(){
    if (intro.currentTime >= HIT_T) boot();
    if (isFinite(intro.duration) && intro.duration - intro.currentTime <= 0.45) startLoop();
  });
  intro.addEventListener('ended', function(){ startLoop(); boot(); });
  intro.addEventListener('error', function(){ startLoop(); boot(); });

  var ip = intro.play();
  if (ip && ip.catch) ip.catch(function(){ startLoop(); boot(); });

  /* страховки: заставка не пошла за 2,5 с — включаемся без неё; в любом случае не позже 7 с */
  setTimeout(function(){ if (!intro.currentTime) { startLoop(); boot(); } }, 2500);
  setTimeout(function(){ startLoop(); boot(); }, 7000);
})();
</script>
