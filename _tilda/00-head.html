<!-- Настройки страницы → Дополнительно → HTML-код внутрь head (или Настройки сайта → Ещё) -->
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script>document.documentElement.className += ' js';</script>
<style>
/* ============================================================
   АРГОС — хиро: A «HUD» × C «кино»
   0–3 с: летербокс, заставка, таймкод. Удар герба → HUD включается.
   ============================================================ */
:root{
  --ink:#0A0A0A;
  --ink-2:#111111;
  --bone:#EDE6D6;
  --red:#C8102E;
  --wine:#5A0F18;

  --bone-90:rgba(237,230,214,.9);
  --bone-75:rgba(237,230,214,.75);
  --bone-60:rgba(237,230,214,.6);
  --bone-40:rgba(237,230,214,.4);
  --bone-16:rgba(237,230,214,.16);
  --red-50:rgba(200,16,46,.5);
  --red-30:rgba(200,16,46,.3);

  --frame:20px;
  --mark:22px;
  --gutter:clamp(22px,4vw,56px);
  --bar:clamp(56px,calc((100svh - 100vw / 2.39) / 2),16svh);

  --font-display:'Oswald',Impact,sans-serif-condensed,sans-serif;
  --font-text:'Golos Text',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (max-width:699px){
  :root{ --frame:10px; --mark:18px; }
}

*,*::before,*::after{ box-sizing:border-box; }
html{ color-scheme:dark; -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--ink);
  color:var(--bone);
  font-family:var(--font-text);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
img,video,svg{ display:block; max-width:100%; }
a{ color:inherit; text-decoration:none; }
ul{ margin:0; padding:0; list-style:none; }
h1,h2,p{ margin:0; }
::selection{ background:var(--red); color:var(--bone); }
:focus-visible{ outline:2px solid var(--bone); outline-offset:3px; }
.vh{ position:absolute!important; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }

/* ---------- HUD-слой поверх всей страницы ---------- */
.hud{ position:fixed; inset:0; z-index:50; pointer-events:none; overflow:hidden; }
.hud-frame{ display:none; }
.hud-mark{ position:absolute; width:var(--mark); height:var(--mark); border:2px solid var(--bone-75); }
.hud-mark.tl{ top:calc(var(--frame) - 6px); left:calc(var(--frame) - 6px); border-right:0; border-bottom:0; transform-origin:0 0; }
.hud-mark.tr{ top:calc(var(--frame) - 6px); right:calc(var(--frame) - 6px); border-left:0; border-bottom:0; transform-origin:100% 0; }
.hud-mark.bl{ bottom:calc(var(--frame) - 6px); left:calc(var(--frame) - 6px); border-right:0; border-top:0; transform-origin:0 100%; }
.hud-mark.br{ bottom:calc(var(--frame) - 6px); right:calc(var(--frame) - 6px); border-left:0; border-top:0; transform-origin:100% 100%; }
.hud-grain{
  position:absolute; inset:-8%;
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22%3E%3Cfilter id=%22g%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.92%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3CfeColorMatrix type=%22saturate%22 values=%220%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23g)%22/%3E%3C/svg%3E") repeat;
  background-size:180px 180px;
  opacity:.06;
}
.hud-scan{
  position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.2) 2px 3px);
  opacity:.6;
}

/* ---------- Плавающая кнопка MAX (заметка Макса) ---------- */
.fab{
  position:fixed; z-index:60;
  right:calc(var(--frame) + 14px); bottom:calc(var(--frame) + 14px);
  display:inline-flex; align-items:center; gap:9px;
  padding:11px 16px 12px 14px;
  background:var(--red); color:var(--bone);
  font-family:var(--font-display); font-weight:600; font-size:15px; line-height:1;
  letter-spacing:.1em; text-transform:uppercase;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
  transition:background-color .15s ease, color .15s ease, transform .15s ease, opacity .5s ease;
}
.fab:hover{ background:var(--bone); color:var(--ink); }
.fab-dot{ width:8px; height:8px; border-radius:50%; background:currentColor; animation:blink 1.6s steps(1,end) infinite; }
@media (max-width:699px){
  .fab{ right:calc(var(--frame) + 8px); bottom:calc(var(--frame) + 8px); padding:12px 14px 13px 12px; font-size:14px; }
}

/* ---------- Хиро ---------- */
.hero{
  position:relative; isolation:isolate; overflow:clip;
  min-height:100vh; min-height:100svh;
  display:flex; flex-direction:column; justify-content:flex-end;
  background:var(--ink);
}
.hero-poster,.hero-video{
  position:absolute; inset:0; z-index:0;
  width:100%; height:100%; object-fit:cover; object-position:50% 45%;
}
.hero-poster{ transition:opacity .4s ease; }
.has-intro .hero-poster{ opacity:0; }
.hero-video{ opacity:0; transition:opacity .6s ease; filter:saturate(.72) contrast(1.06); }
.hero-video.v-intro{ z-index:1; filter:none; }
.hero-video.v-loop{ z-index:2; }
.hero-video.is-on{ opacity:1; }
.hero-shade{
  position:absolute; inset:0; z-index:3;
  background:
    linear-gradient(to top, rgba(10,10,10,.96) 0%, rgba(10,10,10,.72) 30%, rgba(10,10,10,.22) 58%, rgba(10,10,10,.42) 100%),
    linear-gradient(to right, rgba(10,10,10,.6) 0%, rgba(10,10,10,0) 62%),
    radial-gradient(ellipse at 50% 50%, rgba(10,10,10,0) 55%, rgba(10,10,10,.55) 100%);
  transition:opacity .9s ease;
}
.is-cinema .hero-shade{ opacity:.3; }

/* ---------- Кино-слой: летербокс, кикер, таймкод ---------- */
.cine{ position:absolute; inset:0; z-index:5; pointer-events:none; }
.cine-bar{
  position:absolute; left:0; right:0; height:var(--bar);
  background:var(--ink);
  display:flex; align-items:center; justify-content:center;
  transition:transform .8s cubic-bezier(.7,0,.2,1);
}
.cine-bar--top{ top:0; }
.cine-bar--bottom{ bottom:0; flex-direction:column; gap:10px; }
.cine-emblem{
  height:clamp(28px,calc(var(--bar) * .38),48px); width:auto;
  filter:grayscale(1) sepia(.35) brightness(1.12) contrast(1.05); opacity:.9;
}
.cine-motto{ font-size:11px; line-height:1.4; letter-spacing:.06em; color:var(--bone-60); text-align:center; }
.cine-line{ position:relative; width:1px; height:26px; background:var(--bone-16); overflow:hidden; }
.cine-line::after{
  content:""; position:absolute; left:0; top:0; width:100%; height:100%;
  background:var(--bone); transform:translateY(-100%);
  animation:drip 2.6s cubic-bezier(.6,0,.3,1) infinite;
}
@keyframes drip{ to{ transform:translateY(100%); } }
.cine-kicker{
  position:absolute; left:var(--gutter); right:var(--gutter);
  top:calc(var(--bar) + 26px);
  text-align:center;
  font-size:10.5px; line-height:1.7; font-weight:500;
  letter-spacing:.28em; text-transform:uppercase;
  color:var(--bone); text-shadow:0 1px 2px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.8);
  opacity:0; transition:opacity 1.2s ease .5s;
}
.is-cinema.has-intro .cine-kicker{ opacity:1; }
@media (max-width:1100px){ .cine-kicker{ top:calc(var(--bar) + 44px); } }   /* планшет: не сталкиваться с таймкодом справа */
.cine-kicker span + span::before{ content:"·"; margin:0 .9em; }
.cine-tc{
  position:absolute; right:calc(var(--gutter)); top:calc(var(--bar) + 18px);
  font-family:var(--font-mono); font-size:11px; line-height:1; letter-spacing:.08em;
  color:var(--red); font-variant-numeric:tabular-nums;
  transition:opacity .3s ease;
}
/* после включения HUD: полосы уезжают, кикер и таймкод гаснут */
.is-ready .cine-bar--top{ transform:translateY(-100%); }
.is-ready .cine-bar--bottom{ transform:translateY(100%); }
.is-ready .cine-kicker,.is-ready .cine-tc{ opacity:0; transition:opacity .25s ease; }
.is-ready .cine{ transition:visibility 0s 1s; visibility:hidden; }

/* горизонт + прицел */
.hero-horizon{
  position:absolute; z-index:4; left:var(--frame); right:var(--frame); top:50%;
  height:1px; background:var(--red-50);
  box-shadow:0 0 10px rgba(200,16,46,.35);
}
.hero-reticle{
  position:absolute; z-index:4; left:50%; top:50%;
  width:min(240px,56vw); height:auto;
  transform:translate(-50%,-50%);
  color:var(--bone-16);
}

/* навигация */
.nav{
  position:absolute; z-index:6; left:0; right:0; top:var(--frame);
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:14px var(--gutter);
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-emblem{ width:34px; height:34px; object-fit:contain; flex:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.brand-name{
  font-family:var(--font-display); font-weight:700; font-size:21px; line-height:1;
  letter-spacing:.08em; text-transform:uppercase; color:var(--bone);
}
.brand-rule{ width:1px; height:16px; background:var(--bone-40); flex:none; }
.brand-unit{ font-size:13px; line-height:1; color:var(--bone-60); white-space:nowrap; letter-spacing:.01em; }
.btn-ghost{
  flex:none;
  display:inline-flex; align-items:center;
  padding:9px 14px 10px;
  border:1px solid var(--bone-40);
  font-size:13px; font-weight:500; line-height:1; letter-spacing:.01em;
  color:var(--bone);
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
.btn-ghost:hover{ background:var(--bone); color:var(--ink); border-color:var(--bone); }
@media (max-width:479px){ .brand-rule,.brand-unit{ display:none; } .brand-emblem{ width:30px; height:30px; } }

/* телеметрия */
.tele{
  position:absolute; z-index:6;
  font-family:var(--font-mono); font-size:11px; line-height:1.55; font-weight:400;
  letter-spacing:.08em; color:var(--bone-60);
  white-space:nowrap;
}
@media (min-width:1200px){ .tele{ font-size:12px; } }
.tele-tl{ top:calc(var(--frame) + 76px); left:var(--gutter); }
.tele-tr{ top:calc(var(--frame) + 72px); right:var(--gutter); text-align:right; }
.tele-bl{ bottom:calc(var(--frame) + 14px); left:var(--gutter); }
.tele-br{ bottom:calc(var(--frame) + 18px); right:calc(var(--gutter) + 132px); text-align:right; font-family:var(--font-text); font-size:13px; letter-spacing:0; color:var(--bone-60); }
.tele .v{ color:var(--bone-90); }
.tele .rec{ color:var(--red); display:inline-block; transform:translateY(-1px); animation:blink 1.1s steps(1,end) infinite; }
@keyframes blink{ 50%{ opacity:.15; } }
@media (max-width:699px){
  .tele-bl,.tele-br{ display:none; }
  .tele-tl{ top:calc(var(--frame) + 66px); }
  .tele-tr{ top:calc(var(--frame) + 66px); }
  .tele .hide-sm{ display:none; }
}

/* копи */
.hero-copy{
  position:relative; z-index:6;
  width:100%;
  padding:120px var(--gutter) calc(var(--frame) + 56px);
}
@media (max-width:699px){ .hero-copy{ padding-bottom:calc(var(--frame) + 70px); padding-top:150px; } }
.hero-copy-in{ max-width:760px; }

.hero-title{ font-weight:400; line-height:1; }
.hero-kicker{
  display:block;
  font-family:var(--font-display); font-weight:500;
  font-size:clamp(15px,1.6vw,23px); line-height:1.2;
  letter-spacing:.06em; text-transform:uppercase;
  color:var(--bone-75);
  max-width:24em;
}
.hero-word-row{ position:relative; margin-top:2px; }
.hero-word{
  display:block;
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(108px,23vw,280px); line-height:.86;
  letter-spacing:-.005em; text-transform:uppercase;
  color:var(--bone);
  margin:0 -.06em -.1em -.02em; padding:0 .06em .1em 0;   /* маска режет по боксу строки — даём место выносам «О»/«С» снизу и справа */
  /* потёртость: запечённая маска, дёшево для GPU */
  -webkit-mask:url("https://cdn.jsdelivr.net/gh/AlexanderAbramovich/argos-assets@v1/assets/img/grunge-mask.png") 0 0/1024px 512px repeat;
          mask:url("https://cdn.jsdelivr.net/gh/AlexanderAbramovich/argos-assets@v1/assets/img/grunge-mask.png") 0 0/1024px 512px repeat;
}
@media (max-width:699px){ .hero-word{ -webkit-mask-size:560px 280px; mask-size:560px 280px; } }  /* крап пропорционально буквам */
@media (max-width:699px){   /* телефон: 16:9 не зумим в кадр — видео в верхних 62 % экрана, снизу растворяется в чёрный под текст */
  .hero-poster,.hero-video{ height:62svh; bottom:auto; object-position:50% 40%;
    -webkit-mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); mask-image:linear-gradient(to bottom, #000 62%, transparent 100%); }
}
.hero-plaque{
  display:inline-block;
  margin-top:10px;
  padding:4px 14px 5px 12px;
  background:var(--red); color:var(--bone);
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(17px,1.8vw,26px); line-height:1.15;
  letter-spacing:.08em; word-spacing:.12em; text-transform:uppercase;
  clip-path:polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%);
}
.hero-lead{
  margin-top:22px;
  font-size:clamp(15px,1.15vw,18px); line-height:1.5;
  color:var(--bone-90);
  max-width:36em;
}
.hero-points{ margin-top:14px; display:grid; gap:7px; max-width:36em; }
.hero-points li{
  position:relative; padding-left:18px;
  font-size:clamp(14px,1.05vw,16px); font-weight:500; line-height:1.45;
  color:var(--bone-90);
}
.hero-points li::before{ content:""; position:absolute; left:0; top:.52em; width:7px; height:7px; background:var(--red); }
.hero-cta{ margin-top:26px; display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; }
.btn-primary{
  display:inline-flex; align-items:center; justify-content:center;
  padding:12px 24px 13px;
  background:var(--red); color:var(--bone);
  font-family:var(--font-display); font-weight:600;
  font-size:clamp(17px,1.3vw,20px); line-height:1;
  letter-spacing:.08em; text-transform:uppercase;
  transition:background-color .15s ease, color .15s ease, transform .1s ease;
}
.btn-primary:hover{ background:var(--bone); color:var(--ink); }
.btn-primary:active{ transform:translateY(1px); }
.hero-note{ font-size:13px; line-height:1.4; color:var(--bone-60); max-width:22em; }

/* @BLOCKS_CSS:start */
/* ============================================================
   БЛОКИ 2–8. Система: секция = «экран» HUD.
   Один мелкий элемент на секцию — индекс в моно. Остальное — тип и воздух.
   ============================================================ */
.sec{
  position:relative;
  padding:clamp(72px,9vw,128px) var(--gutter);
  border-top:1px solid rgba(237,230,214,.08);
  background:var(--ink);
}
.sec--alt{ background:var(--ink-2); }
.sec-in{ max-width:1240px; margin:0 auto; }
.sec-idx{
  display:inline-flex; align-items:center; gap:10px;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--bone-60);
  margin-bottom:clamp(20px,2.6vw,34px);
}
.sec-idx::before{ content:""; width:7px; height:7px; background:var(--red); }
.h2{
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(34px,4.6vw,68px); line-height:.98;
  letter-spacing:-.005em; text-transform:uppercase;
  color:var(--bone);
  text-wrap:balance;
}
.h2 em{ font-style:normal; color:var(--red); }
.lead{ font-size:clamp(16px,1.2vw,19px); line-height:1.55; color:var(--bone-90); max-width:34em; }
.small{ font-size:13px; line-height:1.45; color:var(--bone-60); }
.btn-primary--sm{ padding:11px 20px 12px; font-size:16px; }
.btn-line{
  display:inline-flex; align-items:center; gap:10px;
  padding:11px 18px 12px;
  border:1px solid var(--bone-40); color:var(--bone);
  font-family:var(--font-display); font-weight:600; font-size:16px; line-height:1;
  letter-spacing:.08em; text-transform:uppercase;
  transition:background-color .15s ease, color .15s ease, border-color .15s ease;
}
.btn-line:hover{ background:var(--bone); color:var(--ink); border-color:var(--bone); }
.btn-line .ico{ width:16px; height:16px; }

/* медиа-заглушки: пока файла нет — рамка и имя файла; появился — картинка */
.media{ position:relative; overflow:hidden; background:#151515; }
.media img,.media video{ width:100%; height:100%; object-fit:cover; }
.media.is-missing::before{
  content:attr(data-ph); position:absolute; inset:0; z-index:1;
  display:flex; align-items:flex-end; padding:10px 12px;
  font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; color:var(--bone-40);
  border:1px dashed rgba(237,230,214,.22);
  background:
    linear-gradient(135deg, transparent 49.5%, rgba(237,230,214,.12) 49.5%, rgba(237,230,214,.12) 50.5%, transparent 50.5%),
    #141414;
  white-space:pre-line;
}
.media.is-missing img{ visibility:hidden; }

/* видео-скраб (режим Tilda) */
.media .scrub-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; }
.media.has-video .scrub-video{ display:block; }
.media.has-video > img{ visibility:hidden; }
@media (max-width:959px){ .op-media .scrub-video{ object-fit:cover; } }

/* появление на скролле: тихое */
.js .rv{ opacity:0; transform:translateY(14px); }
.js .rv.is-in{ opacity:1; transform:none; transition:opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1); }

/* ---------- 02 Оператор: сцена на чёрном ---------- */
.sec--black{ background:#000; }
@media (min-width:960px){ .sec--black{ padding-bottom:0; } }
.brief-head{ display:grid; gap:20px 56px; align-items:start; }
@media (min-width:960px){ .brief-head{ grid-template-columns:minmax(0,7fr) minmax(0,5fr); } .brief-head .lead{ padding-top:.5em; } }
@media (min-width:960px){ .brief-head .h2{ max-width:14ch; } }
.op-scene{ position:relative; margin-top:clamp(28px,4vw,56px); }
@media (min-width:960px){ .op-scene.has-frames{ height:260vh; } }
.op-sticky{ position:relative; }
@media (min-width:960px){ .op-scene.has-frames .op-sticky{ position:sticky; top:0; min-height:100svh; display:grid; align-items:center; } }
.op-stage{ position:relative; width:min(100%,1240px); min-width:0; margin:0 auto; padding:0 var(--gutter); }
@media (min-width:960px){ .op-scene.has-frames .op-stage{ width:100%; max-width:none; padding:0; } }
.op-media{ position:relative; aspect-ratio:16/9; background:#000; }
@media (min-width:960px){ .op-scene.has-frames .op-media{ aspect-ratio:auto; height:100svh; } }
.op-media img,.op-media canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 100%; }
.op-media img{ position:absolute; }
.op-media canvas{ display:none; }
.op-media.has-frames canvas{ display:block; }
.op-media.has-frames > img{ visibility:hidden; }
/* появление из темноты: маска по прогрессу (JS ставит --reveal 0→1) */
.op-media::after{ content:""; position:absolute; inset:0; background:#000; opacity:calc(1 - var(--reveal,1)); pointer-events:none; transition:opacity .2s linear; }
.op-media.has-frames{ --reveal:0; }   /* кадры есть → до первого скролла сцены оператор в темноте (JS ставит --reveal по прогрессу) */
.op-callouts .callout .txt{ background:rgba(0,0,0,.72); }
/* десктоп: плашки на рейках слева/справа (в чёрном поле кадра), линия от якоря до ближней кромки; всё считает JS */
@media (min-width:960px){
  .op-callouts .callout .txt{ top:var(--ty,0px); transform:translateY(-50%); width:240px; min-width:0; max-width:none; }
  @media (max-width:1199px){ .op-callouts .callout .txt{ width:200px; font-size:14px; } }
  .op-callouts .callout[data-side="r"] .txt{ left:var(--tx,0px); right:auto; }
  .op-callouts .callout[data-side="l"] .txt{ left:auto; right:calc(-1 * var(--tx,0px)); }
}
@media (max-width:959px){
  .op-scene{ padding:0 var(--gutter); }

/* @FX:pay-odometer start */
/* 03 Доход: счётчик купюр. Каждый символ — колонка .odo-d высотой в строку (.9em, как line-height .pay-big),
   у цифр внутри лента .odo-s из 20 <i> (0–9 дважды); --n = конечная позиция (10+цифра), CSS ставит её сам:
   без GSAP/JS число стоит верно. JS крутит ленты непрерывно (дробный сдвиг), как барабаны в купюросчётной машине:
   значение разгоняется 0 → 6 000 000 и тормозит, старшие разряды докатываются первыми, младшие мельтешат до конца. */
.pay-big{ font-variant-numeric:tabular-nums; font-size:clamp(44px,12vw,180px); }   /* крупнее: было 9.5vw/150 */
.odo{ display:block; white-space:nowrap; }
/* окно колонки сдвинуто на .04em вниз (top + минус-margin ленты): округлые цифры Oswald свисают под базовую линию
   на .016em — так хвост предыдущей цифры не просвечивает сверху, а низ текущей не режется */
.odo-d{ position:relative; top:.04em; display:inline-block; vertical-align:bottom; height:.9em; overflow:hidden; }
.odo-s{ display:block; margin-top:-.04em; transform:translateY(calc(var(--n,0) * -.9em)); will-change:transform; }
.odo-s i{ display:block; height:.9em; line-height:.9; font-style:normal; text-align:center; }
.pay-big.is-hit{ filter:brightness(1.7); }            /* один кадр удара при посадке */
.pay-big.is-hit .odo{ transform:translateY(4px); }     /* просадка табло на кадр */
.pay-plaque-w{ display:flex; justify-self:start; }    /* обнимает плашку; без строчного strut'а */
.odo-armed .pay-plaque-w{ opacity:0; }                 /* только когда счётчик взведён (GSAP есть, reduce нет) */
.odo-armed .pay-plaque-w.is-wipe{ animation:bWipe .5s steps(14) both; }   /* bWipe — из хиро (index.html) */
/* @FX:pay-odometer end */

/* @FX:spec-selector start */
/* ---------- 04 Специальности: выбор класса. Скобки живут внутри карточки (растут вместе с ней), выбранная — в цвете, по наведению выезжает над сеткой ---------- */
.spec-grid{ position:relative; --spec-pop:1; }
@media (max-width:959px){ .spec-grid.has-sel .spec.is-sel{ transform:scale(1.03); } .spec-grid.has-sel .spec .media img{ filter:grayscale(1) brightness(.38) contrast(1.05); } .spec-grid.has-sel .spec.is-sel .media img{ filter:none; } }   /* тач: выбор за скроллом, выбранный чуть крупнее и в цвете */
@media (min-width:960px){ .spec-grid{ --spec-pop:1.14; } }    /* 2 колонки: карточки широкие, большой pop вылетает за экран */
@media (min-width:1100px){ .spec-grid{ --spec-pop:1.45; } }   /* 4 колонки — большой pop как в игре; на тач не растим */
.spec{ position:relative; }
.spec .spec-sel{
  position:absolute; inset:-5px; z-index:4; pointer-events:none; opacity:0;
  --sc:var(--bone-75); --sl:var(--mark); --sw:2px;
  background:
    linear-gradient(var(--sc),var(--sc)) 0 0/var(--sl) var(--sw) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 0 0/var(--sw) var(--sl) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 100% 0/var(--sl) var(--sw) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 100% 0/var(--sw) var(--sl) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 0 100%/var(--sl) var(--sw) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 0 100%/var(--sw) var(--sl) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 100% 100%/var(--sl) var(--sw) no-repeat,
    linear-gradient(var(--sc),var(--sc)) 100% 100%/var(--sw) var(--sl) no-repeat;
}
.spec.is-sel .spec-sel{ opacity:1; }
/* как в игре: выбранный класс — в цвете, остальные притухшие ч/б; по наведению карта выезжает над сеткой (pop с лёгким перелётом) */
.js .spec-grid.has-sel .spec.rv.is-in{ transition:opacity .6s ease, transform .22s cubic-bezier(.2,.8,.3,1.12), border-color .14s steps(2); }
.spec-grid.has-sel .spec .media img{ filter:grayscale(1) brightness(.5) contrast(1.05); transition:filter .14s steps(2); }
.spec-grid.has-sel .spec.is-sel{ z-index:3; border-color:var(--bone-60); background:var(--ink-2); }
.spec-grid.has-sel .spec.is-sel .media img{ filter:none; }
.spec-grid.has-sel .spec.is-sel.is-pop{ transform:scale(var(--spec-pop)); z-index:5; box-shadow:0 30px 80px rgba(0,0,0,.6); }
/* карточки и шаги — цветные генерации (v3), в покое сайт показывает их ч/б, выбранная — как есть */
.spec-grid.has-sel .spec:focus-visible{ outline:0; }
/* @FX:spec-selector end */

/* @FX:steps-stamps start */
/* 07 Шаги = выбор миссии (как в CoD). Десктоп: сцена липнет на 220vh; слева — большое превью активного этапа (номер, название, текст, фото),
   справа — список четырёх этапов лесенкой: миниатюра + название; активный подсвечен, пройденные со штампом на миниатюре.
   Скролл переключает этап 1→4, клик/Enter — прыжок к нему. Мобилка: обычные карточки, активна та, что у 40 % экрана.
